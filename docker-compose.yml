# RTA 2026 - docker-compose (infrastruktura). Wlasciciel: Osoba 1.
# Kafka wewnatrz sieci: broker:9092 | z hosta: localhost:29092
# Spark: bez osobnego klastra - Osoby 3 i 4 uruchamiaja joby w trybie local[*].

services:

  broker:
    image: confluentinc/cp-kafka:7.6.1
    hostname: broker
    container_name: broker
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker:29093"
      KAFKA_LISTENERS: "INTERNAL://broker:9092,CONTROLLER://broker:29093,EXTERNAL://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://broker:9092,EXTERNAL://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "broker:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      broker:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      kafka-topics --bootstrap-server broker:9092 --create --if-not-exists --topic synop  --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server broker:9092 --create --if-not-exists --topic hydro  --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server broker:9092 --create --if-not-exists --topic alerts --partitions 3 --replication-factor 1
      echo 'Utworzone topiki:'
      kafka-topics --bootstrap-server broker:9092 --list
      "
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: rta-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:9092
      DYNAMIC_CONFIG_ENABLED: "true"

  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rta_pass}
      POSTGRES_DB: ${POSTGRES_DB:-rta_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rta} -d ${POSTGRES_DB:-rta_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== SERWISY ZESPOLU (kazda osoba odkomentowuje swoj blok) =====
  # producer:        build: ./producer        | env: KAFKA_BOOTSTRAP=broker:9092, SYNOP_TOPIC=synop, HYDRO_TOPIC=hydro
  # spark-weather:   build: ./spark-weather   | env: KAFKA_BOOTSTRAP=broker:9092, SOURCE_TOPIC=synop,  ALERTS_TOPIC=alerts | spark-submit --master local[*] --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1
  # spark-hydro:     build: ./spark-hydro     | env: KAFKA_BOOTSTRAP=broker:9092, SOURCE_TOPIC=hydro,  ALERTS_TOPIC=alerts
  # dashboard:       build: ./dashboard       | env: KAFKA_BOOTSTRAP=broker:9092, ALERTS_TOPIC=alerts, POSTGRES_HOST=postgres | port 8501:8501

volumes:
  kafka-data:
  postgres-data:
