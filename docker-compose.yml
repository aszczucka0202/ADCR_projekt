version: '3.8'

# Definiujemy wspólną sieć, żeby kontenery (maszyny) mogły ze sobą "rozmawiać"
networks:
  rta_network:
    driver: bridge

services:
  # 1. BAZA DANYCH (Dla Osoby 5)
  postgres:
    image: postgres:15
    container_name: rta_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: rta_database
    ports:
      - "5432:5432"
    networks:
      - rta_network
    restart: always

  # 2. KAFKA (Dla Osób 2, 3, 4) - Używamy trybu KRaft (bez Zookeepera), żeby oszczędzić Twój RAM
  kafka:
    image: bitnami/kafka:3.4.1
    container_name: rta_kafka
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_BROKER_ID=1
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - ALLOW_PLAINTEXT_LISTENER=yes
    ports:
      - "9092:9092"
    networks:
      - rta_network

  # 3. SPARK MASTER (Serce obliczeniowe dla Osób 3 i 4)
  spark-master:
    image: bitnami/spark:3.4.1
    container_name: rta_spark_master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8080:8080" # Panel WWW do podglądu zadań Sparka
      - "7077:7077" # Wewnętrzny port komunikacyjny
    networks:
      - rta_network

  # 4. SPARK WORKER (Robotnik, który wykonuje właściwą pracę)
  spark-worker:
    image: bitnami/spark:3.4.1
    container_name: rta_spark_worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=1
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    depends_on:
      - spark-master
    networks:
      - rta_network

  # -----------------------------------------------------------------------
  # MIEJSCE NA KOD ZESPOŁU (Zostawiamy to zakomentowane, dodamy w Fazie 3)
  # -----------------------------------------------------------------------
  
  # producer:
  #   build: ./producer
  #   ...
  
  # dashboard:
  #   build: ./dashboard
  #   ...